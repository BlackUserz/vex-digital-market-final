<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Leaderboard — VEX DIGITAL MARKET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .lb-table{ max-width:760px; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
  .lb-row{ display:flex; align-items:center; gap:16px; padding:16px 22px; border-bottom:1px solid var(--border); }
  .lb-row:last-child{ border-bottom:none; }
  .lb-rank{ width:30px; font-family:'Poppins',sans-serif; font-weight:800; color:var(--text-faint); font-size:15px; }
  .lb-row:nth-child(1) .lb-rank{ color:#fbbf24; }
  .lb-row:nth-child(2) .lb-rank{ color:#cbd5e1; }
  .lb-row:nth-child(3) .lb-rank{ color:#d97757; }
  .lb-avatar{ width:38px; height:38px; border-radius:50%; background:var(--grad-primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#fff; flex:none; }
  .lb-info{ flex:1; min-width:0; }
  .lb-info b{ font-size:13.5px; display:block; }
  .lb-info span{ font-size:11.5px; color:var(--text-faint); }
  .lb-count{ font-family:'Poppins',sans-serif; font-weight:700; color:var(--accent); font-size:14px; }
</style>
</head>
<body>

<div id="navbar-root"></div>

<section class="page-head">
  <div class="container">
    <span class="eyebrow">Papan Peringkat</span>
    <h1>Pelanggan Paling Aktif</h1>
    <p>Apresiasi untuk pelanggan setia bulan ini.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="lb-table" id="lbTable"></div>
  </div>
</section>

<div id="footer-root"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/components.js"></script>
<script src="js/chatbot.js"></script>
<script>
  renderNavbar('leaderboard.html');
  renderFooter();

  const LEADERS = [
    { name:'Rian A.', tx: 42 }, { name:'Dinda P.', tx: 37 }, { name:'Farhan S.', tx: 33 },
    { name:'Bagas W.', tx: 28 }, { name:'Citra M.', tx: 25 }, { name:'Ilham R.', tx: 21 },
    { name:'Nadia F.', tx: 19 }, { name:'Yoga P.', tx: 16 },
  ];
  document.getElementById('lbTable').innerHTML = LEADERS.map((l,i)=>`
    <div class="lb-row">
      <span class="lb-rank">#${i+1}</span>
      <span class="lb-avatar">${l.name[0]}</span>
      <div class="lb-info"><b>${l.name}</b><span>Pelanggan VDM</span></div>
      <span class="lb-count">${l.tx} transaksi</span>
    </div>`).join('');
</script>
</body>
</html>
